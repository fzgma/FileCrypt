name: 手动构建与测试

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC 15 / x86-64 / glibc 2.34
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 构建静态依赖和通用 Linux 发布版
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --env GITHUB_SHA --env GITHUB_SERVER_URL --env GITHUB_REPOSITORY --env GITHUB_RUN_ID \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash .github/scripts/build-linux.sh
      - name: 在受支持发行版运行单元、冒烟和文件流程测试
        run: |
          set -euo pipefail
          # 只列仍在维护的版本；版本进入 EOL 后从正式矩阵移除。
          for image in ubuntu:22.04 ubuntu:24.04 debian:12 debian:13 almalinux:9 archlinux:base; do
            docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
              "$image" bash .github/scripts/test-linux.sh "${image//:/-}"
          done
      - name: 在不满足 x86-64-v2 的模拟 CPU 上运行单元、冒烟和文件流程测试
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --env FILECRYPT_TEST_CPU=baseline \
            ubuntu:22.04 bash .github/scripts/test-linux.sh ubuntu-22.04-baseline
      - name: 仅保留 Linux 正式可执行文件
        uses: actions/upload-artifact@v7.0.2
        with:
          name: filecrypt-linux-x86_64
          archive: true
          path: build/filecrypt
          if-no-files-found: error
          retention-days: 14

  msvc:
    name: Windows / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 准备 vcpkg 二进制缓存
        id: vcpkg-cache-config
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/vcpkg-binary-cache" -Force | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/vcpkg-binary-cache,readwrite" >> $env:GITHUB_ENV
          $revision = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - name: 恢复 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-binary-v1-windows-2022-${{ steps.vcpkg-cache-config.outputs.revision }}-${{ hashFiles('cmake/triplets/x64-windows-release.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-binary-v1-windows-2022-${{ steps.vcpkg-cache-config.outputs.revision }}-${{ hashFiles('cmake/triplets/x64-windows-release.cmake') }}-
      - name: 使用 vcpkg 安装 Botan 和 Zstandard
        id: vcpkg-install
        run: |
          $cacheDirectory = "$env:RUNNER_TEMP/vcpkg-binary-cache"
          $before = @(Get-ChildItem -LiteralPath $cacheDirectory -Filter '*.zip' -Recurse -File).Count
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install botan:x64-windows-release zstd:x64-windows-release "--overlay-triplets=$env:GITHUB_WORKSPACE/cmake/triplets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = @(Get-ChildItem -LiteralPath $cacheDirectory -Filter '*.zip' -Recurse -File).Count
          if ($after -gt $before) { "cache-updated=true" >> $env:GITHUB_OUTPUT }
      # 安装成功且新增二进制包时立即保存，后续测试失败也能复用依赖。
      - name: 保存 vcpkg 二进制缓存
        if: steps.vcpkg-install.outputs.cache-updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: 配置 Release
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-release
          "-DVCPKG_OVERLAY_TRIPLETS=$env:GITHUB_WORKSPACE/cmake/triplets"
          -DBUILD_TESTING=ON -DCMAKE_CONFIGURATION_TYPES=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DBotan_USE_STATIC_LIBS=ON -DZstd_USE_STATIC_LIBS=ON
      - name: 编译正式程序与全部测试
        run: cmake --build build --config Release --target build_all --parallel 2
      - name: 运行单元测试
        run: ctest --test-dir build -C Release -L unit --output-on-failure
      - name: 运行正式程序冒烟测试
        run: ctest --test-dir build -C Release -L smoke --output-on-failure
      - name: 运行文件流程集成测试
        run: ctest --test-dir build -C Release -L integration -LE smoke --output-on-failure
      - name: 验证 Windows 单文件分发
        run: |
          New-Item -ItemType Directory -Path build/standalone -Force | Out-Null
          Copy-Item build/Release/filecrypt.exe build/standalone/filecrypt.exe
          # 隔离依赖搜索路径，确认最终 exe 不需要随附第三方 DLL。
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & ./build/standalone/filecrypt.exe -h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 仅保留 Windows 正式可执行文件
        uses: actions/upload-artifact@v7.0.2
        with:
          name: filecrypt-windows-x86_64
          archive: true
          path: build/Release/filecrypt.exe
          if-no-files-found: error
          retention-days: 14
